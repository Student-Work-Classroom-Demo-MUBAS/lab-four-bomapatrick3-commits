<!-- Block elements — each starts on a new line -->
<div style="background: lightblue; padding: 8px;">I am a block element
(div)</div>
<p style="background: lightyellow; padding: 8px;">I am also a block element
(p)</p>

<!-- Inline elements — flow within text -->
<p>I have <span style="background: lightgreen;">an inline span</span>
and <a href="#">an inline link</a> inside me.</p>

<!-- Inline-block — flows like inline but accepts dimensions -->
<p>
<span style="display: inline-block; width: 80px; height: 80px;
background: coral; text-align: center;
line-height: 80px;">Box 1</span>
<span style="display: inline-block; width: 80px; height: 80px;
background: gold; text-align: center;
line-height: 80px;">Box 2</span>
<span style="display: inline-block; width: 80px; height: 80px;
background: plum; text-align: center;
line-height: 80px;">Box 3</span>
</p>
